<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Pro - ERP</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230044ff%22/%3E%20%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-family%3D%22Arial%2C%20Helvetica%2C%20sans-serif%22%20font-size%3D%2234%22%20font-weight%3D%22800%22%20fill%3D%22%23FFFFFF%22%20text-anchor%3D%22middle%22%3E%3B%29%3C/text%3E%20%3C/svg%3E">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase (V8 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    :root {
      /* Locked Dark Mode */
      --bg-main: #1a1a1a;
      --bg-sidebar: #121212;
      --bg-card: #242424;
      --bg-hover: #2a2a2a;
      --text-main: #ffffff;
      --text-muted: #94A3B8;
      --border-color: #333333;
      --accent: #0044ff;
      --accent-glow: rgba(0, 68, 255, 0.4);
      --menu-glow-start: rgba(0, 68, 255, 0.02);
      --menu-glow-end: rgba(0, 68, 255, 0.8);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0; padding: 0; 
      background-color: var(--bg-main); 
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    h1, h2, h3, h4, .font-title { font-family: 'Space Grotesk', sans-serif; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

    input, button, textarea, select { font-family: inherit; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }

    /* =========================================
       STRUCTURAL STYLES & COLLAPSIBLE SIDEBAR
       ========================================= */
    .app-layout { display: flex; height: 100vh; flex-direction: row; }
    
    .sidebar-wrapper { width: 80px; flex-shrink: 0; position: relative; z-index: 50; }
    .sidebar { 
      position: absolute; top: 0; left: 0; width: 80px; height: 100vh; 
      background: var(--bg-sidebar); border-right: 1px solid var(--border-color); 
      overflow: hidden; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; flex-direction: column;
    }
    .sidebar:hover { width: 260px; box-shadow: 6px 0 24px rgba(0,0,0,0.5); }
    
    .sidebar-content { width: 260px; height: 100%; padding: 32px 0; display: flex; flex-direction: column; }
    .sidebar-header { padding: 0 20px; display: flex; align-items: center; gap: 16px; margin-bottom: 40px; }
    
    .user-details, .menu-text { opacity: 0; transition: opacity 0.2s ease; white-space: nowrap; }
    .sidebar:hover .user-details, .sidebar:hover .menu-text { opacity: 1; transition-delay: 0.15s; }
    
    .sidebar-nav { display: flex; flex-direction: column; gap: 8px; flex: 1; overflow-y: auto; padding: 0 16px; }
    .sidebar-footer { border-top: 1px solid var(--border-color); padding: 20px 16px 0; display: flex; flex-direction: column; gap: 12px; }
    
    .main-area { flex: 1; padding: 40px 60px; overflow-y: auto; position: relative; scroll-behavior: smooth; }
    
    .card { background: var(--bg-card); border-radius: 20px; padding: 30px; margin-bottom: 32px; border: 1px solid var(--border-color); transition: all 0.3s ease; }
    .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 32px; }

    /* Menu Buttons */
    .menu-btn {
      width: 100%; padding: 12px; border-radius: 10px; border: none; background: transparent; 
      color: var(--text-muted); font-size: 14px; font-weight: 500; cursor: pointer; 
      display: flex; align-items: center; transition: all 0.2s ease; gap: 16px; overflow: hidden;
    }
    .menu-btn:hover { background: var(--bg-hover); color: var(--text-main); }
    .menu-icon { flex-shrink: 0; width: 20px; height: 20px; opacity: 0.7; transition: all 0.2s ease; }
    .menu-btn.active { color: var(--text-main); background: linear-gradient(90deg, transparent 0%, var(--menu-glow-start) 40%, var(--menu-glow-end) 100%); font-weight: 600; }
    .menu-btn.active .menu-icon { opacity: 1; stroke: var(--text-main); }

    /* Glow Effects */
    .glow-tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
    .glow-cyan { background: rgba(0, 210, 211, 0.15); color: #00d2d3; box-shadow: 0 0 12px rgba(0, 210, 211, 0.2); border: 1px solid rgba(0, 210, 211, 0.3); }
    .glow-purple { background: rgba(156, 136, 255, 0.15); color: #9c88ff; box-shadow: 0 0 12px rgba(156, 136, 255, 0.2); border: 1px solid rgba(156, 136, 255, 0.3); }
    .glow-orange { background: rgba(255, 159, 67, 0.15); color: #ff9f43; box-shadow: 0 0 12px rgba(255, 159, 67, 0.2); border: 1px solid rgba(255, 159, 67, 0.3); }
    .glow-red { background: rgba(255, 71, 87, 0.15); color: #ff4757; box-shadow: 0 0 12px rgba(255, 71, 87, 0.2); border: 1px solid rgba(255, 71, 87, 0.3); }
    .glow-green { background: rgba(46, 213, 115, 0.15); color: #2ed573; box-shadow: 0 0 12px rgba(46, 213, 115, 0.2); border: 1px solid rgba(46, 213, 115, 0.3); }

    /* Content Tables */
    .table-responsive { overflow-x: auto; width: 100%; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg-main); }
    .content-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; min-width: 800px; }
    .content-table th { background: var(--bg-card); padding: 14px 16px; color: var(--text-muted); font-weight: 600; font-family: 'Space Grotesk', sans-serif; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
    .content-table td { padding: 10px 16px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
    .content-table tr:last-child td { border-bottom: none; }
    .content-table input { background: transparent; border: 1px solid transparent; color: var(--text-main); font-size: 13px; padding: 8px; border-radius: 6px; width: 100%; transition: all 0.2s; box-sizing: border-box; }
    .content-table input:hover { background: var(--bg-hover); }
    .content-table input:focus { border-color: var(--accent); background: var(--bg-card); outline: none; }
    .content-table select { cursor: pointer; appearance: none; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; border: 1px solid transparent; outline: none; text-align: center; }
    
    input[type="date"] { color-scheme: dark; }

    /* Content Statuses */
    .status-todo { background: rgba(148, 163, 184, 0.15); color: #94A3B8; border-color: rgba(148, 163, 184, 0.3); }
    .status-progress { background: rgba(0, 210, 211, 0.15); color: #00d2d3; border-color: rgba(0, 210, 211, 0.3); }
    .status-review { background: rgba(255, 159, 67, 0.15); color: #ff9f43; border-color: rgba(255, 159, 67, 0.3); }
    .status-approved { background: rgba(156, 136, 255, 0.15); color: #9c88ff; border-color: rgba(156, 136, 255, 0.3); }
    .status-delivered { background: rgba(46, 213, 115, 0.15); color: #2ed573; border-color: rgba(46, 213, 115, 0.3); }

    /* Modal & FAB UI */
    .fab-btn { background: var(--accent); color: white; padding: 10px 20px; border-radius: 30px; font-weight: 600; cursor: pointer; border: none; box-shadow: 0 4px 15px var(--accent-glow); transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; font-size: 14px;}
    .fab-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); }
    
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal-card { background: var(--bg-card); padding: 32px; border-radius: 24px; border: 1px solid var(--border-color); width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); transform: translateY(20px); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); max-height: 90vh; overflow-y: auto;}
    .modal-overlay.open .modal-card { transform: translateY(0); }
    .modal-input { width: 100%; background: var(--bg-main); border: 1px solid var(--border-color); padding: 14px 16px; border-radius: 12px; color: var(--text-main); font-size: 14px; margin-bottom: 16px; }
    
    /* Toolbar & Accordion UI */
    .accordion-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; padding-bottom: 16px; }
    .chevron { transition: transform 0.3s ease; }
    .chevron.open { transform: rotate(180deg); }
    .toolbar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .toolbar-input { flex: 1; min-width: 140px; background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 14px; border-radius: 10px; font-size: 13px; transition: border-color 0.2s; }
    .toolbar-select { background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 14px; border-radius: 10px; font-size: 13px; cursor: pointer; transition: border-color 0.2s; min-width: 120px; }

    /* PRINT STYLES FOR INVOICE */
    @media print {
      body * { visibility: hidden; }
      .app-layout { display: none !important; }
      #print-area, #print-area * { visibility: visible; }
      #print-area { position: absolute; left: 0; top: 0; width: 100%; background: white !important; color: black !important; padding: 20px; }
      .no-print { display: none !important; }
    }

    /* Invoice Canvas (Web View) */
    .invoice-canvas { background: #FFFFFF; color: #000000; padding: 60px; max-width: 800px; margin: 0 auto; font-family: 'Inter', sans-serif; box-shadow: 0 0 30px rgba(0,0,0,0.5); position: relative;}
    .invoice-header { display: flex; justify-content: space-between; margin-bottom: 40px; border-bottom: 2px solid #EEE; padding-bottom: 20px;}
    .invoice-title { font-size: 28px; font-weight: 700; color: #1a1a1a; margin: 0; font-family: 'Space Grotesk', sans-serif;}
    .invoice-meta { text-align: right; font-size: 14px; color: #666; }
    .invoice-details { display: flex; justify-content: space-between; margin-bottom: 40px; font-size: 14px;}
    .invoice-details h4 { margin: 0 0 8px 0; color: #888; text-transform: uppercase; font-size: 12px; letter-spacing: 1px;}
    .invoice-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; font-size: 14px; }
    .invoice-table th { text-align: left; padding: 12px 8px; border-bottom: 2px solid #EEE; color: #666; }
    .invoice-table td { padding: 12px 8px; border-bottom: 1px solid #EEE; }
    .invoice-total { display: flex; justify-content: flex-end; font-size: 18px; margin-bottom: 50px; }
    .invoice-total-box { background: #F8F9FA; padding: 20px 30px; border-radius: 8px; text-align: right; min-width: 300px;}
    .invoice-footer { display: flex; justify-content: space-between; font-size: 12px; color: #666; align-items: flex-end;}
    .invoice-signature { text-align: center; margin-top: 40px;}

  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Helper: Formato COP
    const formatCOP = (val) => new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 }).format(val || 0);

    // Helper: Número a letras (Simple para Facturas)
    function numeroALetras(num) {
        if (!num || num === 0) return "Cero pesos";
        const unidades = ["", "un", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve"];
        const decenas = ["", "diez", "veinte", "treinta", "cuarenta", "cincuenta", "sesenta", "setenta", "ochenta", "noventa"];
        const especiales = {11:"once", 12:"doce", 13:"trece", 14:"catorce", 15:"quince", 16:"dieciséis", 17:"diecisiete", 18:"dieciocho", 19:"diecinueve", 21:"veintiún", 22:"veintidós", 23:"veintitrés", 24:"veinticuatro", 25:"veinticinco", 26:"veintiséis", 27:"veintisiete", 28:"veintiocho", 29:"veintinueve"};
        
        function decenar(n) {
            if (n < 10) return unidades[n];
            if (n >= 11 && n <= 19) return especiales[n];
            if (n >= 21 && n <= 29) return especiales[n];
            if (n % 10 === 0) return decenas[n/10];
            return decenas[Math.floor(n/10)] + " y " + unidades[n%10];
        }
        function centenar(n) {
            if (n === 100) return "cien";
            const centenas = ["", "ciento", "doscientos", "trescientos", "cuatrocientos", "quinientos", "seiscientos", "setecientos", "ochocientos", "novecientos"];
            if (n < 100) return decenar(n);
            return centenas[Math.floor(n/100)] + (n%100 > 0 ? " " + decenar(n%100) : "");
        }
        function millares(n) {
            if (n < 1000) return centenar(n);
            if (n === 1000) return "mil " + centenar(n%1000);
            return centenar(Math.floor(n/1000)) + " mil " + (n%1000 > 0 ? centenar(n%1000) : "");
        }
        function millones(n) {
            if (n < 1000000) return millares(n);
            if (n === 1000000) return "un millón " + millares(n%1000000);
            return millares(Math.floor(n/1000000)) + " millones " + (n%1000000 > 0 ? millares(n%1000000) : "");
        }
        let texto = millones(num).trim();
        return texto.charAt(0).toUpperCase() + texto.slice(1) + " pesos";
    }

    const EditableInput = ({ value, onSave, type = "text", placeholder = "", style = {}, list = null }) => {
        const [localVal, setLocalVal] = useState(value || '');
        useEffect(() => { setLocalVal(value || '') }, [value]);
        return (
            <input 
                type={type} value={localVal} onChange={e => setLocalVal(e.target.value)}
                onBlur={() => { if(localVal !== value) onSave(localVal) }}
                placeholder={placeholder} style={style} list={list}
            />
        );
    };

    // FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyBRJZdyVHUSNN7qDF08Zi8aFbqLbIWDFzA",
      authDomain: "weekly-planner-8486a.firebaseapp.com",
      projectId: "weekly-planner-8486a",
      storageBucket: "weekly-planner-8486a.firebasestorage.app",
      messagingSenderId: "712578012405",
      appId: "1:712578012405:web:6d402fff597f289941e1bc"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();
    const auth = firebase.auth();

    function App() {
      const [user, setUser] = useState(null);
      const [activeTab, setActiveTab] = useState('home');
      
      const [clients, setClients] = useState([]);
      const [contentRecords, setContentRecords] = useState([]);
      const [invoices, setInvoices] = useState([]);
      const [fixedIncomes, setFixedIncomes] = useState({}); // { "2026-09": 1000000 }
      
      const [loading, setLoading] = useState(true);
      const currentMonth = new Date().toISOString().substring(0, 7); // YYYY-MM

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((user) => {
          if (user) {
            setUser(user);
            loadClients(user.uid);
            loadContentRecords(user.uid);
            loadInvoices(user.uid);
            loadFixedIncomes(user.uid);
          } else {
            setUser(null);
            setLoading(false);
          }
        });
        return () => unsubscribe();
      }, []);

      const loginWithGoogle = async () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        try { await auth.signInWithPopup(provider); } catch (e) { console.error(e); }
      };
      const logout = () => { auth.signOut(); };

      // ==========================================
      // DATA LOADING
      // ==========================================
      const loadClients = (uid) => {
        db.collection('users').doc(uid).collection('clients').where('archived', '==', false).onSnapshot(snap => {
            setClients(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
      };
      const loadContentRecords = (uid) => {
        db.collection('users').doc(uid).collection('content_records').orderBy('createdAt', 'asc').onSnapshot(snap => {
          setContentRecords(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          setLoading(false);
        });
      };
      const loadInvoices = (uid) => {
        db.collection('users').doc(uid).collection('invoices').onSnapshot(snap => {
          setInvoices(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
      };
      const loadFixedIncomes = (uid) => {
        db.collection('users').doc(uid).collection('settings').doc('finance').onSnapshot(doc => {
            if(doc.exists) setFixedIncomes(doc.data().fixedIncomes || {});
        });
      };

      // ==========================================
      // CRUD CLIENTS
      // ==========================================
      const addClient = async (data) => {
        if (!user) return;
        await db.collection('users').doc(user.uid).collection('clients').add({
          ...data, archived: false, createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      };
      const softDeleteClient = async (id) => {
        if (!user || !window.confirm("¿Ocultar este cliente?")) return;
        await db.collection('users').doc(user.uid).collection('clients').doc(id).update({ archived: true });
      };

      // ==========================================
      // CRUD CONTENT & AUTOMATED FINANCE LOGIC
      // ==========================================
      const addContent = async (projectKey, isAgency, extraData = {}) => {
        if (!user) return;
        await db.collection('users').doc(user.uid).collection('content_records').add({
          project: projectKey, videoName: extraData.videoName || '', status: extraData.status || 'Sin empezar', notes: '', brand: isAgency ? (extraData.brand || '') : null, 
          dateReceived: extraData.dateReceived || '', dateDelivered: '', deadline: extraData.deadline || '', price: 0,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      };

      const updateContent = async (id, field, value) => {
        if (!user) return;
        const record = contentRecords.find(r => r.id === id);
        if (!record) return;

        await db.collection('users').doc(user.uid).collection('content_records').doc(id).update({ [field]: value });

        // FINANCE AUTOMATION LOGIC
        if (field === 'status') {
            const client = clients.find(c => c.id === record.project);
            if (client && client.paymentModality === 'Por video' && client.requiresInvoice) {
                const month = new Date().toISOString().substring(0, 7);
                const appliedPrice = Number(record.price) || Number(client.baseRate) || 0;
                
                if (value === 'Entregado') {
                    await autoAddInvoiceItem(client.id, month, { recordId: id, videoName: record.videoName || 'Video sin nombre', price: appliedPrice });
                } else if (record.status === 'Entregado') {
                    // Si antes estaba entregado y ahora no, restarlo de la cuenta de cobro borrador
                    await autoRemoveInvoiceItem(client.id, month, id);
                }
            }
        }
      };

      const autoAddInvoiceItem = async (clientId, month, item) => {
          const draft = invoices.find(i => i.clientId === clientId && i.month === month && i.status === 'Borrador');
          if (draft) {
              const exists = draft.items.find(i => i.recordId === item.recordId);
              if (!exists) {
                  const newItems = [...draft.items, item];
                  const newTotal = newItems.reduce((acc, curr) => acc + curr.price, 0);
                  await db.collection('users').doc(user.uid).collection('invoices').doc(draft.id).update({ items: newItems, total: newTotal });
              }
          } else {
              // Create new draft
              const invoiceCount = invoices.length + 1; // Basic sequential, can be optimized
              await db.collection('users').doc(user.uid).collection('invoices').add({
                  clientId, month, status: 'Borrador', number: invoiceCount.toString().padStart(3, '0'),
                  items: [item], total: item.price, createdAt: firebase.firestore.FieldValue.serverTimestamp()
              });
          }
      };

      const autoRemoveInvoiceItem = async (clientId, month, recordId) => {
          const draft = invoices.find(i => i.clientId === clientId && i.month === month && i.status === 'Borrador');
          if (draft) {
              const newItems = draft.items.filter(i => i.recordId !== recordId);
              const newTotal = newItems.reduce((acc, curr) => acc + curr.price, 0);
              await db.collection('users').doc(user.uid).collection('invoices').doc(draft.id).update({ items: newItems, total: newTotal });
          }
      };

      const deleteContent = async (id) => {
        if (!user || !window.confirm("¿Eliminar registro?")) return;
        await db.collection('users').doc(user.uid).collection('content_records').doc(id).delete();
      };

      // ==========================================
      // INVOICE MANUAL ACTIONS
      // ==========================================
      const updateInvoiceStatus = async (id, status) => {
          if(!user) return;
          await db.collection('users').doc(user.uid).collection('invoices').doc(id).update({ status });
      };
      const updateFixedIncome = async (month, value) => {
          if(!user) return;
          const updated = { ...fixedIncomes, [month]: Number(value) };
          await db.collection('users').doc(user.uid).collection('settings').doc('finance').set({ fixedIncomes: updated }, { merge: true });
      };

      if (loading) return <div style={{display:'flex', height:'100vh', alignItems:'center', justifyContent:'center'}}>Cargando...</div>;
      
      if (!user) {
        return (
          <div style={{display:'flex', height:'100vh', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:'20px'}}>
            <h1 className="font-title" style={{fontSize:'32px', margin:0}}>Dashboard ERP</h1>
            <p style={{color:'var(--text-muted)'}}>Autenticación segura vinculada a tu cuenta.</p>

            {activeTab === 'content' && <ContentView clients={clients} contentRecords={contentRecords} addContent={addContent} updateContent={updateContent} deleteContent={deleteContent} />}

    // ==========================================
    // VIEW: HOME
    // ==========================================
    function HomeView({ clients, contentRecords, invoices, fixedIncomes, currentMonth, addContent }) {
        const pendingVideos = contentRecords.filter(r => r.status === 'Sin empezar' || r.status === 'En progreso').length;
        
        // Revenue logic
        const currentFixed = fixedIncomes[currentMonth] || 0;
        const currentPaidInvoices = invoices.filter(i => i.month === currentMonth && i.status === 'Pagada').reduce((acc, curr) => acc + curr.total, 0);
        const totalCurrent = currentFixed + currentPaidInvoices;

        const prevDate = new Date(); prevDate.setMonth(prevDate.getMonth() - 1);
        const prevMonth = prevDate.toISOString().substring(0, 7);
        const prevFixed = fixedIncomes[prevMonth] || 0;
        const prevPaidInvoices = invoices.filter(i => i.month === prevMonth && i.status === 'Pagada').reduce((acc, curr) => acc + curr.total, 0);
        const totalPrev = prevFixed + prevPaidInvoices;

        const diff = totalPrev === 0 ? 100 : ((totalCurrent - totalPrev) / totalPrev) * 100;

        // Quick Add Form State
        const [qClient, setQClient] = useState('');
        const [qVideo, setQVideo] = useState('');
        const [qBrand, setQBrand] = useState('');
        const [qDateRec, setQDateRec] = useState('');
        const [qDeadline, setQDeadline] = useState('');
        
        const handleQuickAdd = () => {
            if(!qClient || !qVideo) return alert("Cliente y Video requeridos");
            const c = clients.find(cl => cl.id === qClient);
            addContent(qClient, c?.type === 'Agencia', { videoName: qVideo, brand: qBrand, dateReceived: qDateRec, deadline: qDeadline, status: 'Sin empezar' });
            setQVideo(''); setQBrand(''); setQDateRec(''); setQDeadline(''); alert("Añadido al registro");
        };

        return (
            <div style={{ maxWidth: "1100px", margin: "0 auto" }}>
                <h1 className="font-title" style={{ fontSize: "32px", margin: "0 0 32px 0" }}>Resumen Global</h1>
                
                <div className="kpi-grid">
                    <div className="card" style={{ marginBottom: 0, padding: "24px" }}>
                        <div style={{ color: "var(--text-muted)", fontSize: "14px", marginBottom: "8px" }}>Videos Pendientes</div>
                        <div className="font-title" style={{ fontSize: "36px", color: "#00d2d3" }}>{pendingVideos}</div>
                        <div style={{ fontSize: "12px", color: "var(--text-muted)", marginTop: "8px" }}>En estado To do o In progress</div>
                    </div>
                    <div className="card" style={{ marginBottom: 0, padding: "24px" }}>
                        <div style={{ color: "var(--text-muted)", fontSize: "14px", marginBottom: "8px" }}>Ingresos del Mes (Pagado)</div>
                        <div className="font-title" style={{ fontSize: "32px", color: "#2ed573" }}>{formatCOP(totalCurrent)}</div>
                        <div style={{ fontSize: "12px", color: diff >= 0 ? "#2ed573" : "#ff4757", marginTop: "8px", fontWeight: 600 }}>
                            {diff > 0 ? '↑' : '↓'} {Math.abs(diff).toFixed(1)}% vs mes anterior
                        </div>
                    </div>
                </div>

                <div className="card">
                    <h2 className="font-title" style={{ margin: "0 0 20px 0", fontSize: "20px" }}>Añadir Pendiente Rápido</h2>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: "16px" }}>
                        <select className="modal-input" style={{marginBottom: 0}} value={qClient} onChange={e => setQClient(e.target.value)}>
                            <option value="">Seleccionar Cliente...</option>
                            {clients.map(c => <option key={c.id} value={c.id}>{c.name} {c.type === 'Agencia' ? '(Agencia)' : ''}</option>)}
                        </select>
                        <input type="text" className="modal-input" style={{marginBottom: 0}} placeholder="Nombre del video" value={qVideo} onChange={e => setQVideo(e.target.value)} />
                        {clients.find(c => c.id === qClient)?.type === 'Agencia' && (
                            <input type="text" className="modal-input" style={{marginBottom: 0}} placeholder="Marca" value={qBrand} onChange={e => setQBrand(e.target.value)} />
                        )}
                        <input type="date" className="modal-input" style={{marginBottom: 0}} title="Fecha Recepción" value={qDateRec} onChange={e => setQDateRec(e.target.value)} />
                        <input type="date" className="modal-input" style={{marginBottom: 0}} title="Fecha Límite" value={qDeadline} onChange={e => setQDeadline(e.target.value)} />
                        <button className="fab-btn" style={{ height: "46px", justifyContent: "center" }} onClick={handleQuickAdd}>+ Registrar</button>
                    </div>
                </div>
            </div>
        );
    }

    // ==========================================
    // VIEW: CLIENTS
    // ==========================================
    function ClientsView({ clients, addClient, softDeleteClient }) {
        const [isModalOpen, setIsModalOpen] = useState(false);
        const [cName, setCName] = useState(""); const [cUrl, setCUrl] = useState("");
        const [cType, setCType] = useState("Estándar"); const [cModality, setCModality] = useState("Por video");
        const [cRate, setCRate] = useState(""); const [cReqInv, setCReqInv] = useState(true);

        const handleSave = () => {
            if(!cName) return;
            addClient({ name: cName, url: cUrl, type: cType, paymentModality: cModality, baseRate: Number(cRate)||0, requiresInvoice: cReqInv, brands: cType==='Agencia'?[]:null });
            setCName(""); setCUrl(""); setIsModalOpen(false); setCRate("");
        };

        return (
            <div style={{ maxWidth: "1100px", margin: "0 auto" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "32px" }}>
                    <h1 className="font-title" style={{ fontSize: "32px", margin: 0 }}>Gestión de Clientes</h1>
                    <button onClick={() => setIsModalOpen(true)} className="fab-btn">+ Nuevo Cliente</button>
                </div>

                <div className="grid-cards">
                    {clients.map(c => (
                        <div key={c.id} className="card" style={{ position: "relative" }}>
                            <button onClick={() => softDeleteClient(c.id)} style={{ position: "absolute", top: "16px", right: "16px", background: "transparent", border: "none", color: "var(--text-muted)", cursor: "pointer", fontSize: "18px" }}>×</button>
                            <span className={`glow-tag ${c.type === 'Agencia' ? 'glow-orange' : 'glow-cyan'}`}>{c.type}</span>
                            <h2 className="font-title" style={{ margin: "12px 0 8px 0", fontSize: "20px" }}>{c.name}</h2>
                            {c.url && <a href={c.url} target="_blank" style={{ color: "var(--accent)", textDecoration: "none", fontSize: "13px", display: "block", marginBottom: "16px" }}>Enlace ↗</a>}
                            
                            <div style={{ background: "var(--bg-main)", padding: "12px", borderRadius: "10px", fontSize: "13px", color: "var(--text-muted)" }}>
                                <div><strong style={{color:"var(--text-main)"}}>Cobro:</strong> {c.paymentModality}</div>
                                {c.paymentModality === 'Por video' && <div><strong style={{color:"var(--text-main)"}}>Tarifa Base:</strong> {formatCOP(c.baseRate)}</div>}
                                <div><strong style={{color:"var(--text-main)"}}>Cuenta Cobro:</strong> {c.requiresInvoice ? 'Sí (Auto)' : 'No'}</div>
                            </div>
                        </div>
                    ))}
                </div>

                {/* MODAL CREAR CLIENTE */}
                <div className={`modal-overlay ${isModalOpen ? 'open' : ''}`} onClick={() => setIsModalOpen(false)}>
                    <div className="modal-card" onClick={e => e.stopPropagation()}>
                        <h2 className="font-title" style={{ margin: "0 0 24px 0", fontSize: "22px" }}>Crear Cliente</h2>
                        
                        <label style={{display:"block", marginBottom: "4px", fontSize:"13px", color:"var(--text-muted)"}}>Nombre *</label>
                        <input type="text" className="modal-input" value={cName} onChange={e => setCName(e.target.value)} />
                        
                        <label style={{display:"block", marginBottom: "4px", fontSize:"13px", color:"var(--text-muted)"}}>Enlace (Web/Carpeta) Opcional</label>
                        <input type="text" className="modal-input" value={cUrl} onChange={e => setCUrl(e.target.value)} />
                        
                        <label style={{display:"block", marginBottom: "4px", fontSize:"13px", color:"var(--text-muted)"}}>Tipo de Flujo</label>
                        <select className="modal-input" value={cType} onChange={e => setCType(e.target.value)}>
                            <option value="Estándar">Estándar (Directo)</option>
                            <option value="Agencia">Agencia (Multimarca)</option>
                            <option value="Fijo">Proyecto Fijo</option>
                        </select>

                        <label style={{display:"block", marginBottom: "4px", fontSize:"13px", color:"var(--text-muted)"}}>Modalidad de Pago</label>
                        <select className="modal-input" value={cModality} onChange={e => setCModality(e.target.value)}>
                            <option value="Por video">Por video (Variable)</option>
                            <option value="Salario fijo">Salario fijo mensual</option>
                            <option value="Proyecto">Pago único por proyecto</option>
                        </select>

                        {cModality === 'Por video' && (
                            <>
                                <label style={{display:"block", marginBottom: "4px", fontSize:"13px", color:"var(--text-muted)"}}>Tarifa Base por Video (COP)</label>
                                <input type="number" className="modal-input" value={cRate} onChange={e => setCRate(e.target.value)} placeholder="Ej: 40000" />
                            </>
                        )}

                        <div style={{display: "flex", alignItems: "center", gap: "10px", marginBottom: "20px"}}>
                            <input type="checkbox" checked={cReqInv} onChange={e => setCReqInv(e.target.checked)} id="reqInv" style={{width:"18px", height:"18px"}} />
                            <label htmlFor="reqInv" style={{fontSize:"14px"}}>Generar Cuentas de Cobro Automáticas</label>
                        </div>

                        <div style={{display: "flex", gap: "12px"}}>
                            <button onClick={() => setIsModalOpen(false)} style={{flex: 1, padding: "12px", background: "transparent", border: "1px solid var(--border-color)", color: "var(--text-main)", borderRadius: "10px", cursor: "pointer"}}>Cancelar</button>
                            <button onClick={handleSave} style={{flex: 1, padding: "12px", background: "var(--accent)", border: "none", color: "#FFF", borderRadius: "10px", cursor: "pointer", fontWeight: "600"}}>Guardar</button>
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    // ==========================================
    // VIEW: CONTENT RECORDS
    // ==========================================
    const STATUS_OPTIONS = [
      { value: 'Sin empezar', label: 'To Do', class: 'status-todo' },
      { value: 'En progreso', label: 'In Progress', class: 'status-progress' },
      { value: 'En revisión', label: 'In Review', class: 'status-review' },
      { value: 'Aprobado', label: 'Approved', class: 'status-approved' },
      { value: 'Entregado', label: 'Delivered', class: 'status-delivered' }
    ];

    const ClientTableAccordion = ({ client, contentRecords, addContent, updateContent, deleteContent }) => {
      const [isExpanded, setIsExpanded] = useState(false);
      let records = contentRecords.filter(r => r.project === client.id);
      
      const isAgency = client.type === 'Agencia';
      const uniqueBrands = isAgency ? [...new Set(records.map(r => r.brand).filter(Boolean))] : [];
      const datalistId = `brands-${client.id}`;

      return (
        <div className="card" style={{ padding: "24px" }}>
          <div className="accordion-header" onClick={() => setIsExpanded(!isExpanded)} style={{ marginBottom: isExpanded ? "16px" : "0", paddingBottom: isExpanded ? "16px" : "0", borderBottom: isExpanded ? "1px dashed var(--border-color)" : "none" }}>
            <div style={{ display: "flex", alignItems: "center", gap: "12px" }}>
              <span className={`glow-tag ${isAgency ? 'glow-orange' : 'glow-cyan'}`}>{client.type}</span>
              <h2 className="font-title" style={{ margin: 0, fontSize: "20px" }}>{client.name}</h2>
            </div>
            <svg className={`chevron ${isExpanded ? 'open' : ''}`} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>

          <div style={{ display: isExpanded ? 'block' : 'none' }}>
            <div className="toolbar" style={{justifyContent: "flex-end"}}>
              <button onClick={() => addContent(client.id, isAgency)} className="fab-btn" style={{ padding: "8px 16px", fontSize: "13px", boxShadow: "none" }}>+ Añadir Fila</button>
            </div>
            {isAgency && <datalist id={datalistId}>{uniqueBrands.map(b => <option key={b} value={b} />)}</datalist>}
            
            <div className="table-responsive">
              <table className="content-table">
                <thead>
                  <tr>
                    <th>Video Name</th>
                    {isAgency && <th>Brand</th>}
                    <th>Recepción</th>
                    <th>Deadline</th>
                    <th>Estado</th>
                    <th>Tarifa (Si aplica)</th>
                    <th>Notas</th>
                    <th style={{textAlign: "center"}}>X</th>
                  </tr>
                </thead>
                <tbody>
                  {records.map(r => (
                    <tr key={r.id}>
                      <td><EditableInput value={r.videoName} onSave={(val) => updateContent(r.id, 'videoName', val)} placeholder="Título..." /></td>
                      {isAgency && <td><EditableInput value={r.brand} onSave={(val) => updateContent(r.id, 'brand', val)} placeholder="Marca..." list={datalistId} /></td>}
                      <td><input type="date" value={r.dateReceived || ''} onChange={(e) => updateContent(r.id, 'dateReceived', e.target.value)} /></td>
                      <td><input type="date" value={r.deadline || ''} onChange={(e) => updateContent(r.id, 'deadline', e.target.value)} /></td>
                      <td>
                        <select value={r.status} onChange={(e) => updateContent(r.id, 'status', e.target.value)} className={STATUS_OPTIONS.find(o => o.value === r.status)?.class || 'status-todo'}>
                          {STATUS_OPTIONS.map(opt => <option key={opt.value} value={opt.value} style={{background: 'var(--bg-card)', color: 'var(--text-main)'}}>{opt.label}</option>)}
                        </select>
                      </td>
                      <td>
                        {client.paymentModality === 'Por video' ? (
                            <EditableInput type="number" value={r.price || client.baseRate} onSave={(val) => updateContent(r.id, 'price', Number(val))} style={{width:"80px"}} />
                        ) : <span style={{color:"var(--text-muted)", fontSize:"12px"}}>-</span>}
                      </td>
                      <td><EditableInput value={r.notes} onSave={(val) => updateContent(r.id, 'notes', val)} placeholder="Notas..." /></td>
                      <td style={{ textAlign: "center" }}><button onClick={() => deleteContent(r.id)} style={{ background: "transparent", border: "none", color: "#ff4757", cursor: "pointer", fontSize: "18px" }}>×</button></td>
                    </tr>
                  ))}
                  {records.length === 0 && <tr><td colSpan={8} style={{textAlign:"center", padding:"20px", color:"var(--text-muted)"}}>Sin registros.</td></tr>}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    function ContentView({ clients, contentRecords, addContent, updateContent, deleteContent }) {
      return (
        <div style={{ maxWidth: "1100px", margin: "0 auto" }}>
          <h1 className="font-title" style={{ fontSize: "32px", margin: "0 0 32px 0" }}>Registro de Contenidos</h1>
          {clients.map(c => (
            <ClientTableAccordion key={c.id} client={c} contentRecords={contentRecords} addContent={addContent} updateContent={updateContent} deleteContent={deleteContent} />
          ))}
        </div>
      );
    }

    // ==========================================

        const fixedValue = fixedIncomes[filterMonth] || 0;
        const monthInvoices = invoices.filter(i => i.month === filterMonth);
        
        const pendingValue = monthInvoices.filter(i => i.status === 'Borrador' || i.status === 'Enviada').reduce((acc, curr) => acc + curr.total, 0);
        const collectedValue = monthInvoices.filter(i => i.status === 'Pagada').reduce((acc, curr) => acc + curr.total, 0) + fixedValue;
        const projectedValue = pendingValue + collectedValue;

        const getClient = (id) => clients.find(c => c.id === id) || { name: 'Desconocido' };
        
        const handlePrint = () => { window.print(); };

        return (
            <div style={{ maxWidth: "1100px", margin: "0 auto", paddingBottom: "60px" }}>
                
                {/* INVOICE PRINT OVERLAY */}
                {printInvoice && (
                    <div className="modal-overlay open no-print" style={{zIndex: 9999, background: "var(--bg-main)", padding: "40px", overflowY: "auto", alignItems: "flex-start"}}>

                            <div style={{display:"flex", justifyContent: "space-between", marginBottom: "20px"}}>

                                    <div style={{flex: 1}}>
                                        <h2 className="invoice-title">Cuenta de Cobro</h2>
                                    </div>
                                    <div className="invoice-meta">
                                        <div><strong>Fecha:</strong> {new Date().toLocaleDateString('es-CO', {day:'2-digit', month:'short', year:'numeric'})}</div>
                                        <div><strong>Cuenta de Cobro:</strong> {printInvoice.number || '001'}</div>
                                    </div>
                                </div>

                                <div className="invoice-details">
                                    <div style={{flex: 1}}>
                                        <h4>Cuenta de Cobro A:</h4>
                                        <div style={{fontSize: "16px", fontWeight: "600", color: "#000"}}>{getClient(printInvoice.clientId).name}</div>
                                    </div>
                                    <div style={{flex: 1.5, textAlign: "right"}}>
                                        <h4>Remitente:</h4>
                                        <div style={{fontWeight: "600", color: "#000", fontSize: "16px"}}>Camilo Ortiz Carvajal</div>
                                        <div>CC. 1.006.128.276</div>
                                        <div>Diseñador Gráfico</div>
                                        <div>+57 315 0011 929</div>
                                        <div>ortizcarvajalcamilo@gmail.com</div>
                                        <div>https://bento.me/camiloc-ortiz</div>
                                    </div>
                                </div>

                                <table className="invoice-table">
                                    <thead>
                                        <tr>
                                            <th>Descripción</th>
                                            <th style={{textAlign: "right", width: "150px"}}>Valor</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {printInvoice.items.map((item, idx) => (
                                            <tr key={idx}>
                                                <td>{item.videoName}</td>
                                                <td style={{textAlign: "right"}}>{formatCOP(item.price)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>

                                <div className="invoice-total">
                                    <div className="invoice-total-box">
                                        <div style={{color: "#666", fontSize: "14px", marginBottom: "4px"}}>Valor total a cobrar</div>
                                        <div style={{fontSize: "24px", fontWeight: "700", color: "#000"}}>{formatCOP(printInvoice.total)}</div>
                                        <div style={{fontSize: "12px", color: "#888", marginTop: "8px", fontStyle: "italic"}}>{numeroALetras(printInvoice.total)}</div>
                                        <div style={{fontSize: "10px", color: "#aaa", marginTop: "4px"}}>*Valor sujeto a retención en la fuente si aplica</div>
                                    </div>
                                </div>

                                <div className="invoice-footer">
                                    <div>
                                        <h4 style={{margin: "0 0 8px 0", color: "#000", fontSize: "14px"}}>Forma de Pago</h4>
                                        <div>Transferencia Bancaria</div>
                                        <div>Bancolombia - Ahorros</div>
                                        <div style={{fontWeight: "600"}}>91275234724</div>
                                        <div>Camilo Ortiz Carvajal</div>
                                    </div>
                                    <div className="invoice-signature">
                                        <div style={{fontFamily: "'Space Grotesk', sans-serif", fontSize: "28px", color: "#999", marginBottom: "8px", borderBottom: "1px solid #CCC", display:"inline-block", padding:"0 20px"}}>
                                            AMILO ORTIZ
                                        </div>
                                        <div style={{fontWeight: "600", color: "#000", fontSize: "14px"}}>Camilo Ortiz Carvajal</div>
                                        <div style={{color: "#666"}}>Diseñador Gráfico</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                )}
                {/* END PRINT OVERLAY */}

                <div className="page-header-flex" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "32px" }}>
                    <h1 className="font-title" style={{ fontSize: "32px", margin: 0 }}>Administración Financiera</h1>
                    <input type="month" className="modal-input" style={{width: "auto", marginBottom: 0}} value={filterMonth} onChange={e => setFilterMonth(e.target.value)} />
                </div>

                <div className="kpi-grid">
                    <div className="card" style={{ marginBottom: 0, padding: "20px" }}>
                        <div style={{ color: "var(--text-muted)", fontSize: "13px", marginBottom: "8px" }}>Ingresos Fijos (Salario)</div>
                        <EditableInput type="number" value={fixedValue} onSave={(val) => updateFixedIncome(filterMonth, val)} style={{ fontSize: "24px", fontWeight: "700", background: "transparent", border: "1px dashed var(--border-color)", color: "#FFF", width: "100%" }} placeholder="Añadir valor..." />
                    </div>
                    <div className="card" style={{ marginBottom: 0, padding: "20px" }}>
                        <div style={{ color: "var(--text-muted)", fontSize: "13px", marginBottom: "8px" }}>Por Cobrar (Borrador/Enviada)</div>
                        <div className="font-title" style={{ fontSize: "24px", color: "#ff9f43" }}>{formatCOP(pendingValue)}</div>
                    </div>
                    <div className="card" style={{ marginBottom: 0, padding: "20px" }}>
                        <div style={{ color: "var(--text-muted)", fontSize: "13px", marginBottom: "8px" }}>Total Cobrado del Mes</div>
                        <div className="font-title" style={{ fontSize: "24px", color: "#2ed573" }}>{formatCOP(collectedValue)}</div>
                    </div>
                    <div className="card" style={{ marginBottom: 0, padding: "20px", border: "1px solid var(--accent)" }}>
                        <div style={{ color: "var(--accent)", fontSize: "13px", marginBottom: "8px", fontWeight: 600 }}>Proyección Total del Mes</div>
                        <div className="font-title" style={{ fontSize: "24px", color: "#FFF" }}>{formatCOP(projectedValue)}</div>
                    </div>
                </div>

                <h2 className="font-title" style={{ fontSize: "20px", marginBottom: "20px" }}>Cuentas de Cobro / Clientes Variables</h2>
                {monthInvoices.length === 0 && <div style={{ color: "var(--text-muted)", fontStyle: "italic" }}>No hay cuentas de cobro generadas este mes. Se crearán automáticamente al entregar videos.</div>}
                
                <div className="grid-cards">
                    {monthInvoices.map(inv => (
                        <div key={inv.id} className="card" style={{ padding: "24px" }}>
                            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "16px" }}>
                                <span className={`glow-tag ${inv.status==='Borrador'?'glow-cyan':inv.status==='Enviada'?'glow-orange':'glow-green'}`}>{inv.status}</span>
                                <span style={{ color: "var(--text-muted)", fontSize: "12px" }}>#{inv.number || '001'}</span>
                            </div>
                            <h3 className="font-title" style={{ margin: "0 0 4px 0", fontSize: "18px" }}>{getClient(inv.clientId).name}</h3>
                            <div style={{ color: "var(--text-muted)", fontSize: "13px", marginBottom: "16px" }}>{inv.items.length} entregables</div>
                            
                            <div className="font-title" style={{ fontSize: "28px", marginBottom: "24px", color: "#FFF" }}>{formatCOP(inv.total)}</div>
                            
                            <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                                <button onClick={() => setPrintInvoice(inv)} style={{ width: "100%", background: "var(--bg-main)", color: "#FFF", border: "1px solid var(--border-color)", padding: "10px", borderRadius: "8px", cursor: "pointer", fontSize: "13px" }}>📄 Ver / Exportar</button>
                                
                                {inv.status === 'Borrador' && <button onClick={() => updateInvoiceStatus(inv.id, 'Enviada')} style={{ width: "100%", background: "var(--accent)", color: "#FFF", border: "none", padding: "10px", borderRadius: "8px", cursor: "pointer", fontSize: "13px", fontWeight: "600" }}>Marcar como Enviada</button>}
                                {inv.status === 'Enviada' && <button onClick={() => updateInvoiceStatus(inv.id, 'Pagada')} style={{ width: "100%", background: "#2ed573", color: "#000", border: "none", padding: "10px", borderRadius: "8px", cursor: "pointer", fontSize: "13px", fontWeight: "600" }}>Marcar como Pagada</button>}
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
