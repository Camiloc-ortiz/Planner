<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Pro - Planner</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230044ff%22/%3E%20%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-family%3D%22Arial%2C%20Helvetica%2C%20sans-serif%22%20font-size%3D%2234%22%20font-weight%3D%22800%22%20fill%3D%22%23FFFFFF%22%20text-anchor%3D%22middle%22%3E%3B%29%3C/text%3E%20%3C/svg%3E">
  
  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase (V8 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    :root {
      /* Dark Mode (Default) */
      --bg-main: #1a1a1a;
      --bg-sidebar: #121212;
      --bg-card: #242424;
      --bg-hover: #2a2a2a;
      --text-main: #ffffff;
      --text-muted: #94A3B8;
      --border-color: #333333;
      --accent: #0044ff;
      --accent-glow: rgba(0, 68, 255, 0.4);
    }

    [data-theme="light"] {
      --bg-main: #fffce9;
      --bg-sidebar: #f4f0d3;
      --bg-card: #ffffff;
      --bg-hover: #e8e4c9;
      --text-main: #1a1a1a;
      --text-muted: #64748B;
      --border-color: #e0dcc2;
      --accent: #0044ff;
      --accent-glow: rgba(0, 68, 255, 0.2);
    }

    body {
      margin: 0; padding: 0; 
      background-color: var(--bg-main); 
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    h1, h2, h3, h4, .font-title {
      font-family: 'Space Grotesk', sans-serif;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

    input, button { font-family: inherit; }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }

    /* Efectos Glow para Categorías */
    .glow-tag {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
      text-transform: uppercase;
      font-family: 'Inter', sans-serif;
    }
    .glow-cyan { background: rgba(0, 210, 211, 0.15); color: #00d2d3; box-shadow: 0 0 12px rgba(0, 210, 211, 0.2); border: 1px solid rgba(0, 210, 211, 0.3); }
    .glow-purple { background: rgba(156, 136, 255, 0.15); color: #9c88ff; box-shadow: 0 0 12px rgba(156, 136, 255, 0.2); border: 1px solid rgba(156, 136, 255, 0.3); }
    .glow-orange { background: rgba(255, 159, 67, 0.15); color: #ff9f43; box-shadow: 0 0 12px rgba(255, 159, 67, 0.2); border: 1px solid rgba(255, 159, 67, 0.3); }
    .glow-green { background: rgba(16, 172, 132, 0.15); color: #10ac84; box-shadow: 0 0 12px rgba(16, 172, 132, 0.2); border: 1px solid rgba(16, 172, 132, 0.3); }

    .checkbox-custom {
      appearance: none; width: 20px; height: 20px;
      border: 2px solid var(--border-color); border-radius: 6px;
      background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .checkbox-custom:checked {
      background: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow);
    }
    .checkbox-custom:checked::after {
      content: '✓'; color: #FFF; font-size: 14px; font-weight: bold;
    }
    
    .task-item { transition: opacity 0.2s; }
    .task-item.done span { text-decoration: line-through; opacity: 0.5; }

    /* Calendario Grilla */
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border-color); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; }
    .cal-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; color: var(--text-muted); padding: 12px 0; font-family: 'Space Grotesk', sans-serif; font-size: 14px; }
    .cal-cell { background: var(--bg-main); min-height: 120px; padding: 8px; cursor: pointer; transition: background 0.2s; }
    .cal-cell:hover { background: var(--bg-hover); }
    .cal-cell.drag-over { background: var(--bg-card); border: 2px dashed var(--accent); }
    
    .event-chip { font-size: 11px; padding: 4px 6px; border-radius: 4px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'Inter', sans-serif; }
    .event-gcal { background: rgba(0, 68, 255, 0.15); color: #82aaff; border-left: 3px solid var(--accent); }
    .event-local { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // 1. CONFIGURACIÓN FIREBASE (LLENA TUS DATOS AQUÍ)
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyBRJZdyVHUSNN7qDF08Zi8aFbqLbIWDFzA",
      authDomain: "weekly-planner-8486a.firebaseapp.com",
      projectId: "weekly-planner-8486a",
      storageBucket: "weekly-planner-8486a.firebasestorage.app",
      messagingSenderId: "712578012405",
      appId: "1:712578012405:web:6d402fff597f289941e1bc"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const auth = firebase.auth();

    // ==========================================
    // COMPONENTE PRINCIPAL
    // ==========================================
    function App() {
      // Estados globales
      const [theme, setTheme] = useState(localStorage.getItem('planner_theme') || 'dark');
      const [user, setUser] = useState(null);
      const [gcalToken, setGcalToken] = useState(null);
      const [activeTab, setActiveTab] = useState('clients'); // 'clients' | 'calendar'
      
      // Datos
      const [sakeBrands, setSakeBrands] = useState(["Marca 1", "Marca 2"]);
      const [tasks, setTasks] = useState([]); // Array de objetos: { id, text, done, category, brand (opcional), date (opcional para calendario) }
      const [gcalEvents, setGcalEvents] = useState([]);
      
      // UI State
      const [loading, setLoading] = useState(true);
      const [draggedTask, setDraggedTask] = useState(null);
      const [selectedDay, setSelectedDay] = useState(null); // Para el modal del día

      // Aplicar tema
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('planner_theme', theme);
      }, [theme]);

      // Autenticación de Firebase + GCal Scopes
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((user) => {
          if (user) {
            setUser(user);
            loadTasks(user.uid);
          } else {
            setUser(null);
            setLoading(false);
          }
        });
        return () => unsubscribe();
      }, []);

      const loginWithGoogle = async () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        // Pedir permisos de lectura para ver eventos del calendario
        provider.addScope('https://www.googleapis.com/auth/calendar.readonly');
        try {
          const result = await auth.signInWithPopup(provider);
          const credential = result.credential;
          if (credential && credential.accessToken) {
            setGcalToken(credential.accessToken);
            fetchCalendarEvents(credential.accessToken);
          }
        } catch (error) {
          console.error("Error al iniciar sesión:", error);
          alert("Error de autenticación. Revisa la consola.");
        }
      };

      const logout = () => { auth.signOut(); setGcalToken(null); setGcalEvents([]); setTasks([]); };

      // Cargar tareas locales desde Firestore
      const loadTasks = (uid) => {
        db.collection('users').doc(uid).collection('tasks').onSnapshot(snap => {
          const loadedTasks = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setTasks(loadedTasks);
          
          // Extraer marcas únicas de Sake Agency
          const sBrands = [...new Set(loadedTasks.filter(t => t.category === 'sake' && t.brand).map(t => t.brand))];
          if (sBrands.length > 0) setSakeBrands(sBrands);
          
          setLoading(false);
        });
      };

      // Funciones CRUD Tareas
      const addTask = async (text, category, brand = null, date = null) => {
        if (!text.trim() || !user) return;
        const newTask = { text, category, brand, done: false, date, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
        await db.collection('users').doc(user.uid).collection('tasks').add(newTask);
      };

      const toggleTask = async (task) => {
        if (!user) return;
        await db.collection('users').doc(user.uid).collection('tasks').doc(task.id).update({ done: !task.done });
      };

      const deleteTask = async (id) => {
        if (!user) return;
        await db.collection('users').doc(user.uid).collection('tasks').doc(id).delete();
      };

      const moveTaskToDate = async (taskId, newDate) => {
        if (!user) return;
        await db.collection('users').doc(user.uid).collection('tasks').doc(taskId).update({ date: newDate });
      };

      // Fetch eventos de Google Calendar
      const fetchCalendarEvents = async (token) => {
        const timeMin = new Date();
        timeMin.setDate(1); // Primer día del mes
        const timeMax = new Date(timeMin);
        timeMax.setMonth(timeMax.getMonth() + 1); // Fin del mes

        try {
          const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${timeMin.toISOString()}&timeMax=${timeMax.toISOString()}&singleEvents=true&orderBy=startTime`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          const data = await res.json();
          if (data.items) {
            setGcalEvents(data.items.map(item => ({
              id: item.id,
              title: item.summary,
              date: item.start.date || item.start.dateTime.split('T')[0],
              isGcal: true
            })));
          }
        } catch (e) {
          console.error("Error fetching GCal", e);
        }
      };

      // ==========================================
      // VISTAS
      // ==========================================
      
      if (loading) return <div style={{display:'flex', height:'100vh', alignItems:'center', justifyContent:'center'}}>Cargando Dashboard...</div>;
      
      if (!user) {
        return (
          <div style={{display:'flex', height:'100vh', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:'20px'}}>
            <h1 className="font-title" style={{fontSize:'32px', margin:0}}>Planner Pro</h1>
            <p style={{color:'var(--text-muted)'}}>Autenticación segura vinculada a tu cuenta.</p>
            <button onClick={loginWithGoogle} style={{
              background:'var(--accent)', color:'#FFF', border:'none', padding:'14px 24px', 
              borderRadius:'12px', fontSize:'16px', fontWeight:'600', cursor:'pointer',
              boxShadow:'0 10px 20px var(--accent-glow)'
            }}>
              Ingresar con Google
            </button>
          </div>
        );
      }

      return (
        <div style={{ display: "flex", height: "100vh" }}>
          
          {/* SIDEBAR */}
          <div style={{ width: "260px", background: "var(--bg-sidebar)", borderRight: "1px solid var(--border-color)", padding: "32px 20px", display: "flex", flexDirection: "column" }}>
            <div style={{ display: "flex", alignItems: "center", gap: "12px", marginBottom: "40px" }}>
              <img src={user.photoURL} alt="User" style={{ width: "40px", height: "40px", borderRadius: "12px" }} />
              <div>
                <div className="font-title" style={{ fontSize: "16px", fontWeight: 700 }}>{user.displayName.split(' ')[0]}</div>
                <div style={{ color: "var(--text-muted)", fontSize: "12px" }}>Post-Producción</div>
              </div>
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: "8px", flex: 1 }}>
              <div style={{ color: "var(--text-muted)", fontSize: "11px", fontWeight: 600, textTransform: "uppercase", letterSpacing: "1px", marginBottom: "8px" }}>Espacios</div>
              
              <button onClick={() => setActiveTab('clients')} style={{
                textAlign: "left", padding: "12px 16px", borderRadius: "12px", border: "none",
                background: activeTab === 'clients' ? "var(--bg-hover)" : "transparent",
                color: activeTab === 'clients' ? "var(--text-main)" : "var(--text-muted)",
                fontSize: "14px", fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: "10px"
              }}>
                <span style={{ fontSize: "18px" }}>📁</span> Clientes & Proyectos
              </button>
              
              <button onClick={() => setActiveTab('calendar')} style={{
                textAlign: "left", padding: "12px 16px", borderRadius: "12px", border: "none",
                background: activeTab === 'calendar' ? "var(--bg-hover)" : "transparent",
                color: activeTab === 'calendar' ? "var(--text-main)" : "var(--text-muted)",
                fontSize: "14px", fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: "10px"
              }}>
                <span style={{ fontSize: "18px" }}>📅</span> Calendario Mensual
              </button>
            </div>

            {/* Ajustes Inferiores */}
            <div style={{ borderTop: "1px solid var(--border-color)", paddingTop: "20px", display: "flex", flexDirection: "column", gap: "12px" }}>
              <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} style={{
                background: "var(--bg-card)", border: "1px solid var(--border-color)", color: "var(--text-main)",
                padding: "10px", borderRadius: "10px", cursor: "pointer", fontSize: "13px", fontWeight: 600
              }}>
                {theme === 'dark' ? '☀️ Modo Claro' : '🌙 Modo Oscuro'}
              </button>
              <button onClick={logout} style={{
                background: "transparent", border: "none", color: "#FF6B6B", textAlign: "left", cursor: "pointer", fontSize: "13px", fontWeight: 600, padding: "0 10px"
              }}>Cerrar Sesión</button>
            </div>
          </div>

          {/* ÁREA PRINCIPAL */}
          <div style={{ flex: 1, padding: "40px 60px", overflowY: "auto", position: "relative" }}>
            
            {activeTab === 'clients' ? (
              <ClientsView tasks={tasks} addTask={addTask} toggleTask={toggleTask} deleteTask={deleteTask} sakeBrands={sakeBrands} setSakeBrands={setSakeBrands} />
            ) : (
              <CalendarView 
                tasks={tasks} gcalEvents={gcalEvents} moveTaskToDate={moveTaskToDate} 
                draggedTask={draggedTask} setDraggedTask={setDraggedTask}
                selectedDay={selectedDay} setSelectedDay={setSelectedDay}
                toggleTask={toggleTask} addTask={addTask}
              />
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // VISTA CLIENTES & PROYECTOS (Checklists)
    // ==========================================
    function ClientsView({ tasks, addTask, toggleTask, deleteTask, sakeBrands, setSakeBrands }) {
      
      const TaskInput = ({ onAdd, placeholder }) => {
        const [val, setVal] = useState("");
        return (
          <input 
            type="text" value={val} onChange={e => setVal(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter' && val) { onAdd(val); setVal(""); } }}
            placeholder={placeholder}
            style={{ width: "100%", background: "var(--bg-main)", border: "1px dashed var(--border-color)", padding: "12px 16px", borderRadius: "10px", color: "var(--text-main)", fontSize: "14px", marginTop: "12px" }}
          />
        );
      };

      const TaskList = ({ list }) => (
        <div style={{ display: "flex", flexDirection: "column", gap: "10px", marginTop: "16px" }}>
          {list.length === 0 && <div style={{ color: "var(--text-muted)", fontSize: "13px", fontStyle: "italic" }}>No hay pendientes.</div>}
          {list.map(t => (
            <div key={t.id} className={`task-item ${t.done ? 'done' : ''}`} style={{ display: "flex", alignItems: "center", gap: "12px", background: "var(--bg-main)", padding: "12px 16px", borderRadius: "10px", border: "1px solid var(--border-color)" }}>
              <input type="checkbox" className="checkbox-custom" checked={t.done} onChange={() => toggleTask(t)} />
              <span style={{ flex: 1, fontSize: "14px", color: t.done ? "var(--text-muted)" : "var(--text-main)" }}>{t.text}</span>
              <button onClick={() => deleteTask(t.id)} style={{ background: "transparent", border: "none", color: "var(--text-muted)", cursor: "pointer", fontSize: "18px" }}>×</button>
            </div>
          ))}
        </div>
      );

      return (
        <div style={{ maxWidth: "900px" }}>
          <h1 className="font-title" style={{ fontSize: "32px", margin: "0 0 40px 0" }}>Clientes & Proyectos</h1>

          {/* 1. LUIS POSADA */}
          <div style={{ background: "var(--bg-card)", borderRadius: "20px", padding: "30px", marginBottom: "32px", border: "1px solid var(--border-color)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div style={{ display: "flex", alignItems: "center", gap: "12px" }}>
                <span className="glow-tag glow-cyan">Cliente</span>
                <h2 className="font-title" style={{ margin: 0, fontSize: "20px" }}>Luis Posada</h2>
              </div>
              <a href="https://www.instagram.com/luisposada.ai/" target="_blank" style={{ color: "var(--accent)", textDecoration: "none", fontSize: "14px", fontWeight: 600 }}>@luisposada.ai ↗</a>
            </div>
            <TaskList list={tasks.filter(t => t.category === 'luis')} />
            <TaskInput onAdd={(text) => addTask(text, 'luis')} placeholder="+ Nuevo pendiente para Luis..." />
          </div>

          {/* 2. SAKE AGENCY */}
          <div style={{ background: "var(--bg-card)", borderRadius: "20px", padding: "30px", marginBottom: "32px", border: "1px solid var(--border-color)" }}>
            <div style={{ display: "flex", alignItems: "center", gap: "12px", marginBottom: "24px" }}>
              <span className="glow-tag glow-orange">Agencia</span>
              <h2 className="font-title" style={{ margin: 0, fontSize: "20px" }}>Sake Agency</h2>
            </div>
            
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))", gap: "24px" }}>
              {sakeBrands.map(brand => (
                <div key={brand} style={{ background: "var(--bg-main)", padding: "20px", borderRadius: "16px", border: "1px solid var(--border-color)" }}>
                  <h3 className="font-title" style={{ margin: "0 0 16px 0", fontSize: "16px", color: "var(--text-muted)" }}>{brand}</h3>
                  <TaskList list={tasks.filter(t => t.category === 'sake' && t.brand === brand)} />
                  <TaskInput onAdd={(text) => addTask(text, 'sake', brand)} placeholder={`+ Tarea para ${brand}`} />
                </div>
              ))}
              
              {/* Botón agregar marca */}
              <div style={{ border: "2px dashed var(--border-color)", borderRadius: "16px", padding: "20px", display: "flex", alignItems: "center", justifyContent: "center" }}>
                <input 
                  type="text" placeholder="+ Agregar Marca" 
                  onKeyDown={e => { if (e.key === 'Enter' && e.target.value) { setSakeBrands([...sakeBrands, e.target.value]); e.target.value=''; } }}
                  style={{ background: "transparent", border: "none", textAlign: "center", color: "var(--text-main)", fontSize: "14px", width: "100%", outline: "none" }}
                />
              </div>
            </div>
          </div>

          {/* 3. MARCA PERSONAL */}
          <div style={{ background: "var(--bg-card)", borderRadius: "20px", padding: "30px", border: "1px solid var(--border-color)" }}>
            <div style={{ display: "flex", alignItems: "center", gap: "12px" }}>
              <span className="glow-tag glow-purple">Proyecto</span>
              <h2 className="font-title" style={{ margin: 0, fontSize: "20px" }}>Marca Personal</h2>
            </div>
            <TaskList list={tasks.filter(t => t.category === 'personal')} />
            <TaskInput onAdd={(text) => addTask(text, 'personal')} placeholder="+ Nuevo pendiente de marca personal..." />
          </div>

        </div>
      );
    }

    // ==========================================
    // VISTA CALENDARIO MENSUAL
    // ==========================================
    function CalendarView({ tasks, gcalEvents, moveTaskToDate, draggedTask, setDraggedTask, selectedDay, setSelectedDay, toggleTask, addTask }) {
      const [currentDate, setCurrentDate] = useState(new Date());
      const [dragOverDate, setDragOverDate] = useState(null);

      // Generar días del mes
      const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
      const firstDayOfMonth = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).getDay();
      
      const days = [];
      // Espacios vacíos al inicio (Ajustado para que Lunes sea el primer día de la grilla)
      const emptyDays = firstDayOfMonth === 0 ? 6 : firstDayOfMonth - 1; 
      for (let i = 0; i < emptyDays; i++) days.push(null);
      // Días reales
      const totalDays = getDaysInMonth(currentDate.getFullYear(), currentDate.getMonth());
      for (let i = 1; i <= totalDays; i++) {
        const d = new Date(currentDate.getFullYear(), currentDate.getMonth(), i);
        // Formato local YYYY-MM-DD ignorando timezone offset
        const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        days.push({ dayNumber: i, dateStr });
      }

      const prevMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));
      const nextMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));

      const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

      const handleDrop = (dateStr) => {
        if (draggedTask && dateStr) {
          moveTaskToDate(draggedTask.id, dateStr);
        }
        setDragOverDate(null);
        setDraggedTask(null);
      };

      return (
        <div style={{ height: "100%", display: "flex", flexDirection: "column" }}>
          
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "32px" }}>
            <h1 className="font-title" style={{ fontSize: "32px", margin: 0 }}>Calendario</h1>
            <div style={{ display: "flex", gap: "16px", alignItems: "center" }}>
              <button onClick={prevMonth} style={{ background: "var(--bg-card)", border: "1px solid var(--border-color)", borderRadius: "8px", padding: "8px 12px", color: "var(--text-main)", cursor: "pointer" }}>&lt;</button>
              <div className="font-title" style={{ fontSize: "20px", minWidth: "160px", textAlign: "center" }}>{monthNames[currentDate.getMonth()]} {currentDate.getFullYear()}</div>
              <button onClick={nextMonth} style={{ background: "var(--bg-card)", border: "1px solid var(--border-color)", borderRadius: "8px", padding: "8px 12px", color: "var(--text-main)", cursor: "pointer" }}>&gt;</button>
            </div>
          </div>

          <div className="cal-header">
            <div>LUN</div><div>MAR</div><div>MIÉ</div><div>JUE</div><div>VIE</div><div>SÁB</div><div>DOM</div>
          </div>
          
          <div className="cal-grid" style={{ flex: 1 }}>
            {days.map((dayObj, i) => {
              if (!dayObj) return <div key={`empty-${i}`} style={{ background: "var(--bg-main)" }} />;
              
              const dayTasks = tasks.filter(t => t.date === dayObj.dateStr);
              const dayGcalEvents = gcalEvents.filter(e => e.date === dayObj.dateStr);
              
              const isToday = dayObj.dateStr === new Date().toISOString().split('T')[0];

              return (
                <div 
                  key={dayObj.dateStr}
                  className={`cal-cell ${dragOverDate === dayObj.dateStr ? 'drag-over' : ''}`}
                  onClick={() => setSelectedDay(dayObj.dateStr)}
                  onDragOver={(e) => { e.preventDefault(); setDragOverDate(dayObj.dateStr); }}
                  onDragLeave={() => setDragOverDate(null)}
                  onDrop={() => handleDrop(dayObj.dateStr)}
                >
                  <div style={{ 
                    fontSize: "13px", fontWeight: 600, marginBottom: "8px", 
                    color: isToday ? "var(--bg-main)" : "var(--text-muted)",
                    background: isToday ? "var(--accent)" : "transparent",
                    width: isToday ? "24px" : "auto", height: isToday ? "24px" : "auto",
                    display: isToday ? "flex" : "block", alignItems: "center", justifyContent: "center", borderRadius: "50%"
                  }}>
                    {dayObj.dayNumber}
                  </div>
                  
                  {/* Eventos Google Calendar (Lectura) */}
                  {dayGcalEvents.slice(0, 2).map(e => (
                    <div key={e.id} className="event-chip event-gcal">G: {e.title}</div>
                  ))}

                  {/* Tareas Locales (Arrastrables) */}
                  {dayTasks.slice(0, 3).map(t => (
                    <div 
                      key={t.id} draggable 
                      onDragStart={(e) => { e.stopPropagation(); setDraggedTask(t); }}
                      className="event-chip event-local"
                      style={{ opacity: t.done ? 0.5 : 1, textDecoration: t.done ? 'line-through' : 'none' }}
                    >
                      {t.text}
                    </div>
                  ))}
                  {(dayTasks.length + dayGcalEvents.length) > 4 && <div style={{ fontSize: "11px", color: "var(--text-muted)", marginTop: "4px" }}>+ más...</div>}
                </div>
              );
            })}
          </div>

          {/* Modal del Día Seleccionado */}
          {selectedDay && (
            <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", backdropFilter: "blur(4px)" }} onClick={() => setSelectedDay(null)}>
              <div style={{ background: "var(--bg-card)", border: "1px solid var(--border-color)", borderRadius: "24px", width: "400px", padding: "32px" }} onClick={e => e.stopPropagation()}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "24px" }}>
                  <h2 className="font-title" style={{ margin: 0 }}>Pendientes del día</h2>
                  <div style={{ color: "var(--text-muted)", fontSize: "14px" }}>{selectedDay}</div>
                </div>

                <div style={{ marginBottom: "24px" }}>
                  <h4 style={{ color: "var(--text-muted)", fontSize: "11px", textTransform: "uppercase", marginBottom: "8px" }}>Eventos Google Calendar</h4>
                  {gcalEvents.filter(e => e.date === selectedDay).map(e => (
                     <div key={e.id} style={{ fontSize: "14px", padding: "8px 0", borderBottom: "1px dashed var(--border-color)", color: "#82aaff" }}>• {e.title}</div>
                  ))}
                  {gcalEvents.filter(e => e.date === selectedDay).length === 0 && <div style={{ fontSize: "13px", color: "var(--border-color)" }}>Sin eventos de calendario.</div>}
                </div>

                <div>
                  <h4 style={{ color: "var(--text-muted)", fontSize: "11px", textTransform: "uppercase", marginBottom: "8px" }}>Tareas del Planner</h4>
                  {tasks.filter(t => t.date === selectedDay).map(t => (
                    <div key={t.id} style={{ display: "flex", alignItems: "center", gap: "10px", padding: "8px 0" }}>
                      <input type="checkbox" className="checkbox-custom" checked={t.done} onChange={() => toggleTask(t)} />
                      <span style={{ fontSize: "14px", color: t.done ? "var(--text-muted)" : "var(--text-main)", textDecoration: t.done ? 'line-through' : 'none' }}>{t.text}</span>
                    </div>
                  ))}
                  <input 
                    type="text" placeholder="+ Agregar tarea rápida a este día..."
                    onKeyDown={e => { if(e.key === 'Enter' && e.target.value) { addTask(e.target.value, 'general', null, selectedDay); e.target.value=''; } }}
                    style={{ width: "100%", background: "var(--bg-main)", border: "1px solid var(--border-color)", padding: "10px 14px", borderRadius: "8px", color: "var(--text-main)", fontSize: "13px", marginTop: "12px" }}
                  />
                </div>

                <button onClick={() => setSelectedDay(null)} style={{ width: "100%", background: "var(--accent)", color: "#FFF", border: "none", padding: "12px", borderRadius: "10px", marginTop: "24px", cursor: "pointer", fontWeight: 600 }}>Cerrar</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
